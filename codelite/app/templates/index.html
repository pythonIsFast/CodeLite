<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Lite</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <img class="logo" src="{{ url_for('static', filename='icon.png') }}" alt="" />
        <span class="brand">Code Lite</span>
      </header>
      <button class="new-chat" id="new-chat">New chat</button>
      <nav class="conversations" id="conversations" aria-label="Conversations"></nav>
      <footer class="sidebar-foot">
        <span id="tool-count"></span>
      </footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-meta">
          <span class="title" id="chat-title">No conversation</span>
          <span class="workspace" id="chat-workspace"></span>
        </div>
        <div class="topbar-controls">
          <label class="control">
            <span>Model</span>
            <select id="model-select"></select>
          </label>
          <label class="control">
            <span>Permissions</span>
            <select id="mode-select"></select>
          </label>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty-state">
          <img class="empty-logo" src="{{ url_for('static', filename='icon.png') }}" alt="" />
          <h1>Code Lite</h1>
          <p>Start a conversation to work in your project.</p>
        </div>
      </section>

      <div class="status-bar" id="status-bar" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">Working…</span>
        <button class="stop" id="stop-run">Stop</button>
      </div>

      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Ask Code Lite to change something…"
                  autocomplete="off" spellcheck="false"></textarea>
        <button type="submit" id="send" title="Send (Enter)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </main>
  </div>

  <div class="overlay" id="permission-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="perm-title">
      <h2 id="perm-title">Permission needed</h2>
      <p class="perm-kind" id="perm-kind"></p>
      <pre class="perm-detail" id="perm-detail"></pre>
      <div class="perm-judge" id="perm-judge" hidden>
        <strong>The safety model blocked this:</strong>
        <p id="perm-judge-reason"></p>
      </div>
      <input class="perm-feedback" id="perm-feedback" type="text"
             placeholder="Optional: tell the agent why (sent on deny)" />
      <div class="perm-actions">
        <button class="btn ghost" id="perm-deny">Deny</button>
        <button class="btn" id="perm-session">Allow for session</button>
        <button class="btn primary" id="perm-once">Allow once</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="new-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="new-title">
      <h2 id="new-title">New conversation</h2>
      <label class="field">
        <span>Workspace directory</span>
        <input id="new-workspace" type="text" spellcheck="false" />
      </label>
      <label class="field">
        <span>Permission mode</span>
        <select id="new-mode"></select>
      </label>
      <div class="perm-actions">
        <button class="btn ghost" id="new-cancel">Cancel</button>
        <button class="btn primary" id="new-create">Create</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
