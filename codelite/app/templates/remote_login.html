<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Lite Remote Control</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171717; color: #f5f5f5; }
    main { width: min(360px, calc(100vw - 40px)); padding: 28px; border: 1px solid #3a3a3a; border-radius: 14px; background: #222; box-shadow: 0 18px 60px #0008; }
    img { display: block; width: 54px; height: 54px; margin: 0 auto 14px; }
    h1 { margin: 0 0 8px; text-align: center; font-size: 22px; }
    p { margin: 0 0 20px; color: #aaa; text-align: center; font-size: 14px; }
    label { display: block; margin-bottom: 7px; font-size: 13px; }
    input, button { width: 100%; box-sizing: border-box; border-radius: 8px; font: inherit; }
    input { padding: 11px 12px; border: 1px solid #505050; background: #181818; color: #fff; }
    button { margin-top: 12px; padding: 11px; border: 0; background: #e17755; color: #fff; font-weight: 650; cursor: pointer; }
    .error { margin: 12px 0 0; color: #ff8f8f; text-align: left; }
  </style>
</head>
<body>
  <main>
    <img src="{{ url_for('static', filename='icon.png') }}" alt="" />
    <h1>Code Lite Remote Control</h1>
    <p>Enter the password shown on the computer running Code Lite.</p>
    <form method="post" autocomplete="off">
      <label for="password">Remote password</label>
      <input id="password" name="password" type="password" required autofocus />
      <button type="submit">Connect</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </main>
</body>
</html>
